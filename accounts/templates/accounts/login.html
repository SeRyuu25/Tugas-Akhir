{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="my-4">
  <h2>Masuk ke Akun Atlet</h2>
  <form method="post">
      {% csrf_token %}
      <div class="mb-3">
          <label for="{{ form.username.id_for_label }}">Email / Gmail</label>
          {{ form.username }}
      </div>
      <div class="mb-3">
          <label for="{{ form.password.id_for_label }}">Kata Sandi</label>
          {{ form.password }}
      </div>
      <button type="submit" class="btn btn-primary">Masuk</button>
  </form>
  <p class="mt-3">Belum punya akun? <a href="{% url 'accounts:register' %}">Daftar di sini</a>.</p>
</div>
{% endblock %}
