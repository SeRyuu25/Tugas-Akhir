{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="my-4">
  <h2>Login</h2>
  <form method="post">
      {% csrf_token %}
      <div class="mb-3">
          <label for="{{ form.username.id_for_label }}">Email:</label>
          {{ form.username }}
      </div>
      <div class="mb-3">
          <label for="{{ form.password.id_for_label }}">Password:</label>
          {{ form.password }}
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
  </form>
  <p class="mt-3">Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a>.</p>
</div>
{% endblock %}
