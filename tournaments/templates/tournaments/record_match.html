{% extends "base.html" %}
{% block content %}
<div class="my-4">
  <h2>Rekam Hasil Pertandingan</h2>
  <p>Tournament: {{ tournament.name }}</p>
  <p>Ronde: {{ match.round }}</p>
  <p>Pertandingan: {{ match.athlete1.user.nickname }} vs {{ match.athlete2.user.nickname }}</p>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="score1">Skor {{ match.athlete1.user.nickname }}:</label>
      <input type="number" name="score1" id="score1" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="score2">Skor {{ match.athlete2.user.nickname }}:</label>
      <input type="number" name="score2" id="score2" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>
        <input type="checkbox" name="confirm" value="yes" required>
        Saya menyatakan bahwa ini sudah final dan tidak bisa diganti kembali.
      </label>
    </div>
    <button type="submit" class="btn btn-success">Simpan Hasil Pertandingan</button>
  </form>
</div>
{% endblock %}
