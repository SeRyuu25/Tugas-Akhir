{% extends "base.html" %}
{% block content %}
  <h2>Record Match Result</h2>
  <p>Tournament: {{ tournament.name }}</p>
  <p>Rounds: {{ match.round }}</p>
  <p>Match: {{ match.athlete1.user.username }} vs {{ match.athlete2.user.username }}</p>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="score1">Score for {{ match.athlete1.user.username }}:</label>
      <input type="number" name="score1" id="score1" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="score2">Score for {{ match.athlete2.user.username }}:</label>
      <input type="number" name="score2" id="score2" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>
        <input type="checkbox" name="confirm" value="yes" required>
        Saya menyatakan bahwa ini sudah final dan tidak bisa diganti kembali.
      </label>
    </div>
    <button type="submit" class="btn btn-success">Submit Match Result</button>
  </form>
{% endblock %}
